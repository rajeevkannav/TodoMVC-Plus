name: ProductionLine (mogra)

on:
  issues:
    types: [opened, labeled]
  repository_dispatch:
    types: [mogra.trigger]
  # Locally built PRs (runtime.build: local) start verification when labelled mogra:built.
  pull_request:
    types: [labeled]

jobs:
  mogra:
    if: >-
      (github.event_name == 'pull_request' && github.event.label.name == 'mogra:built') ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'issues' && (github.event.action == 'opened' ||
        (github.event.action == 'labeled' && (github.event.label.name == 'mogra:approved' || github.event.label.name == 'mogra:run'))))
    uses: rajeevkannav/ProductionLine/.github/workflows/mogra-sdlc.yml@main
    with:
      control_plane_repo: "rajeevkannav/ProductionLine"
    secrets:
      MOGRA_BOT_TOKEN: ${{ secrets.MOGRA_BOT_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
